<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VlocX Kyran - Manual Viewer</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
    }

    header {
      height: 65px;
      background: #0b1220;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      border-bottom: 1px solid #263247;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .admin-btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 7px;
      cursor: pointer;
      text-decoration: none;
    }

    .topbar {
      padding: 15px 20px;
      background: #151f32;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      align-items: center;
      border-bottom: 1px solid #263247;
    }

    .selector {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .selector label {
      font-size: 12px;
      color: #9ca3af;
    }

    select,
    input {
      background: #0f172a;
      color: white;
      border: 1px solid #374151;
      border-radius: 6px;
      padding: 10px;
      min-width: 180px;
    }

    .layout {
      display: grid;
      grid-template-columns: 330px 1fr;
      height: calc(100vh - 145px);
    }

    .sidebar {
      background: #111827;
      border-right: 1px solid #263247;
      overflow-y: auto;
      padding: 15px;
    }

    .tabs {
      display: flex;
      gap: 5px;
      margin-bottom: 15px;
    }

    .tab {
      flex: 1;
      padding: 10px;
      background: #1f2937;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .tab.active {
      background: #2563eb;
    }

    .search-box {
      width: 100%;
      margin-bottom: 15px;
    }

    .tree {
      font-size: 14px;
    }

    .ata {
      margin-bottom: 5px;
    }

    .ata-title {
      background: #1f2937;
      padding: 10px;
      border-radius: 5px;
      cursor: pointer;
    }

    .subject {
      padding: 8px 12px;
      margin-left: 10px;
      cursor: pointer;
      border-radius: 5px;
    }

    .subject:hover {
      background: #1f2937;
    }

    .viewer {
      background: #374151;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .viewer-toolbar {
      height: 55px;
      background: #111827;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
    }

    .viewer-toolbar button {
      background: #2563eb;
      border: none;
      color: white;
      padding: 8px 13px;
      border-radius: 5px;
      cursor: pointer;
    }

    .viewer-info {
      margin-left: auto;
      color: #d1d5db;
      font-size: 14px;
    }

    #pdf-container {
      flex: 1;
      overflow: auto;
      padding: 20px;
      text-align: center;
    }

    canvas {
      display: block;
      margin: 0 auto 15px auto;
      max-width: 100%;
      box-shadow: 0 3px 15px rgba(0,0,0,.4);
    }

    .empty {
      color: #9ca3af;
      text-align: center;
      margin-top: 50px;
    }

    .manual-title {
      background: #1f2937;
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 6px;
      cursor: pointer;
    }

    .manual-title:hover {
      background: #263449;
    }

    @media(max-width: 800px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        height: 40vh;
        border-right: none;
        border-bottom: 1px solid #263247;
      }

      .viewer {
        height: 60vh;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">VlocX Kyran</div>

  <a href="/admin.html" class="admin-btn">
    Admin
  </a>
</header>

<div class="topbar">

  <div class="selector">
    <label>Aircraft</label>

    <select id="aircraftSelect">
      <option value="">Aircraft kiezen...</option>
    </select>
  </div>

  <div class="selector">
    <label>Manual type</label>

    <select id="manualTypeSelect">
      <option value="AMM">AMM</option>
      <option value="IPC">IPC</option>
    </select>
  </div>

</div>

<div class="layout">

  <aside class="sidebar">

    <div class="tabs">
      <button id="browseTab" class="tab active">
        Browse
      </button>

      <button id="searchTab" class="tab">
        Search
      </button>
    </div>

    <div id="searchArea" style="display:none;">
      <input
        id="searchInput"
        class="search-box"
        type="text"
        placeholder="Zoek in manuals..."
      >
    </div>

    <div id="tree" class="tree">
      <div class="empty">
        Kies eerst een aircraft.
      </div>
    </div>

  </aside>

  <main class="viewer">

    <div class="viewer-toolbar">

      <button id="prevBtn">
        ← Vorige
      </button>

      <button id="nextBtn">
        Volgende →
      </button>

      <div class="viewer-info" id="viewerInfo">
        Geen manual geopend
      </div>

    </div>

    <div id="pdf-container">
      <div class="empty">
        Kies een manual om te beginnen.
      </div>
    </div>

  </main>

</div>

<script>

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


  let library = {
    aircraft: []
  };

  let selectedAircraft = null;
  let selectedType = "AMM";

  let currentPdf = null;
  let currentPage = 1;
  let totalPages = 0;


  const aircraftSelect =
    document.getElementById("aircraftSelect");

  const manualTypeSelect =
    document.getElementById("manualTypeSelect");

  const tree =
    document.getElementById("tree");

  const pdfContainer =
    document.getElementById("pdf-container");

  const viewerInfo =
    document.getElementById("viewerInfo");

  const searchInput =
    document.getElementById("searchInput");


  async function loadLibrary() {

    try {

      const response =
        await fetch("/api/library");

      if (!response.ok) {
        throw new Error("Library kon niet worden geladen.");
      }

      library = await response.json();

      fillAircraftDropdown();

    } catch (error) {

      console.error(error);

      tree.innerHTML = `
        <div class="empty">
          Library kon niet worden geladen.
        </div>
      `;
    }
  }


  function fillAircraftDropdown() {

    aircraftSelect.innerHTML = `
      <option value="">
        Aircraft kiezen...
      </option>
    `;

    if (!library.aircraft) return;

    library.aircraft.forEach(aircraft => {

      const option =
        document.createElement("option");

      option.value = aircraft.id;

      option.textContent = aircraft.name;

      aircraftSelect.appendChild(option);

    });
  }


  aircraftSelect.addEventListener("change", () => {

    const id = aircraftSelect.value;

    selectedAircraft =
      library.aircraft.find(
        aircraft => String(aircraft.id) === String(id)
      );

    renderManuals();

  });


  manualTypeSelect.addEventListener("change", () => {

    selectedType =
      manualTypeSelect.value;

    renderManuals();

  });


  function getManuals() {

    if (!selectedAircraft) {
      return [];
    }

    /*
      Manuals kunnen op twee manieren opgeslagen worden.

      1. manual.type = "AMM" / "IPC"
      2. Als type ontbreekt, wordt gekeken naar de naam.
    */

    const manuals =
      selectedAircraft.manuals || [];

    return manuals.filter(manual => {

      if (manual.type) {
        return manual.type.toUpperCase() === selectedType;
      }

      const name =
        (manual.name || manual.filename || "")
        .toUpperCase();

      return name.includes(selectedType);

    });

  }


  function renderManuals() {

    tree.innerHTML = "";

    if (!selectedAircraft) {

      tree.innerHTML = `
        <div class="empty">
          Kies eerst een aircraft.
        </div>
      `;

      return;
    }


    const manuals = getManuals();


    if (!manuals.length) {

      tree.innerHTML = `
        <div class="empty">
          Geen ${selectedType} manuals gevonden
          voor ${selectedAircraft.name}.
        </div>
      `;

      return;
    }


    manuals.forEach(manual => {

      const div =
        document.createElement("div");

      div.className = "manual-title";

      div.textContent =
        manual.name ||
        manual.filename ||
        "Manual";

      div.onclick = () => {

        const url =
          manual.url ||
          manual.path ||
          `/manuals/${encodeURIComponent(
            manual.filename
          )}`;

        openPdf(url, manual.name);

      };

      tree.appendChild(div);

    });

  }


  async function openPdf(url, name) {

    try {

      viewerInfo.textContent =
        "Manual laden...";

      pdfContainer.innerHTML = "";

      currentPage = 1;


      currentPdf =
        await pdfjsLib.getDocument(url).promise;

      totalPages =
        currentPdf.numPages;


      viewerInfo.textContent =
        `${name || "Manual"} — ${totalPages} pagina's`;


      await renderPage(currentPage);

    } catch (error) {

      console.error(error);

      pdfContainer.innerHTML = `
        <div class="empty">
          PDF kon niet worden geladen.
        </div>
      `;

      viewerInfo.textContent =
        "Fout bij laden";

    }

  }


  async function renderPage(pageNumber) {

    if (!currentPdf) return;

    const page =
      await currentPdf.getPage(pageNumber);


    const viewport =
      page.getViewport({
        scale: 1.5
      });


    const canvas =
      document.createElement("canvas");

    const context =
      canvas.getContext("2d");


    canvas.width =
      viewport.width;

    canvas.height =
      viewport.height;


    pdfContainer.innerHTML = "";

    pdfContainer.appendChild(canvas);


    await page.render({
      canvasContext: context,
      viewport: viewport
    }).promise;


    viewerInfo.textContent +=
      ` — pagina ${pageNumber}/${totalPages}`;

  }


  document.getElementById("prevBtn")
    .addEventListener("click", async () => {

      if (!currentPdf) return;

      if (currentPage > 1) {

        currentPage--;

        await renderPage(currentPage);

      }

    });


  document.getElementById("nextBtn")
    .addEventListener("click", async () => {

      if (!currentPdf) return;

      if (currentPage < totalPages) {

        currentPage++;

        await renderPage(currentPage);

      }

    });


  document.getElementById("browseTab")
    .addEventListener("click", () => {

      document
        .getElementById("browseTab")
        .classList.add("active");

      document
        .getElementById("searchTab")
        .classList.remove("active");

      document
        .getElementById("searchArea")
        .style.display = "none";

      renderManuals();

    });


  document.getElementById("searchTab")
    .addEventListener("click", () => {

      document
        .getElementById("searchTab")
        .classList.add("active");

      document
        .getElementById("browseTab")
        .classList.remove("active");

      document
        .getElementById("searchArea")
        .style.display = "block";

      searchInput.focus();

    });


  searchInput.addEventListener("input", () => {

    const query =
      searchInput.value
        .trim()
        .toLowerCase();


    if (!query) {

      renderManuals();

      return;
    }


    tree.innerHTML = "";


    const manuals =
      getManuals();


    const results =
      manuals.filter(manual => {

        const name =
          (
            manual.name ||
            manual.filename ||
            ""
          ).toLowerCase();

        return name.includes(query);

      });


    if (!results.length) {

      tree.innerHTML = `
        <div class="empty">
          Geen resultaten.
        </div>
      `;

      return;
    }


    results.forEach(manual => {

      const div =
        document.createElement("div");

      div.className =
        "manual-title";

      div.textContent =
        manual.name ||
        manual.filename ||
        "Manual";

      div.onclick = () => {

        const url =
          manual.url ||
          manual.path ||
          `/manuals/${encodeURIComponent(
            manual.filename
          )}`;

        openPdf(url, manual.name);

      };

      tree.appendChild(div);

    });

  });


  loadLibrary();

</script>

</body>
</html>

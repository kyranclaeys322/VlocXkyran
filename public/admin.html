<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VlocX Kyran - Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
    }

    header {
      background: #0b1220;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #263247;
    }

    h1 {
      margin: 0;
      font-size: 22px;
    }

    button {
      border: none;
      border-radius: 6px;
      padding: 10px 15px;
      cursor: pointer;
      color: white;
      background: #2563eb;
    }

    button:hover {
      opacity: .9;
    }

    .logout {
      background: #dc2626;
    }

    main {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .card {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 0;
    }

    input,
    select {
      width: 100%;
      background: #111827;
      color: white;
      border: 1px solid #4b5563;
      border-radius: 6px;
      padding: 11px;
      margin: 6px 0 12px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #d1d5db;
      margin-top: 10px;
    }

    .aircraft {
      background: #111827;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 15px;
      margin-top: 15px;
    }

    .aircraft-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 15px;
    }

    .aircraft-name {
      font-size: 18px;
      font-weight: bold;
    }

    .danger {
      background: #dc2626;
    }

    .manual {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: #1f2937;
      padding: 10px;
      border-radius: 6px;
      margin-top: 8px;
    }

    .manual-type {
      font-size: 12px;
      font-weight: bold;
      padding: 4px 7px;
      border-radius: 4px;
      background: #2563eb;
    }

    .message {
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 15px;
      display: none;
    }

    .error {
      background: #7f1d1d;
    }

    .success {
      background: #14532d;
    }

    .hidden {
      display: none;
    }

    .login {
      max-width: 400px;
      margin: 100px auto;
      padding: 20px;
    }
  </style>
</head>

<body>

<header>
  <h1>VlocX Kyran — Admin</h1>

  <button
    id="logoutBtn"
    class="logout hidden"
    onclick="logout()">
    Uitloggen
  </button>
</header>


<!-- LOGIN -->

<div id="loginScreen" class="login">

  <div class="card">

    <h2>Admin login</h2>

    <div id="loginMessage" class="message error"></div>

    <label>Gebruikersnaam</label>

    <input
      id="username"
      type="text"
      autocomplete="username">


    <label>Wachtwoord</label>

    <input
      id="password"
      type="password"
      autocomplete="current-password">


    <button onclick="login()">
      Inloggen
    </button>

  </div>

</div>


<!-- ADMIN -->

<main id="adminScreen" class="hidden">

  <div id="message" class="message"></div>


  <!-- AIRCRAFT TOEVOEGEN -->

  <div class="card">

    <h2>Aircraft toevoegen</h2>

    <label>Aircraft naam</label>

    <input
      id="aircraftName"
      type="text"
      placeholder="Bijvoorbeeld A320">

    <button onclick="addAircraft()">
      Aircraft toevoegen
    </button>

  </div>


  <!-- AIRCRAFT -->

  <div class="card">

    <h2>Aircraft & manuals</h2>

    <div id="aircraftList"></div>

  </div>

</main>


<script>

  let library = {
    aircraft: []
  };


  async function api(url, options = {}) {

    const response =
      await fetch(url, {
        credentials: "include",
        ...options
      });


    const data =
      await response.json()
        .catch(() => ({}));


    if (!response.ok) {

      throw new Error(
        data.error || "Er ging iets fout."
      );

    }


    return data;

  }


  async function checkLogin() {

    try {

      const data =
        await api("/api/me");


      if (data.loggedIn) {

        showAdmin();

      } else {

        showLogin();

      }

    } catch {

      showLogin();

    }

  }


  function showLogin() {

    document
      .getElementById("loginScreen")
      .classList.remove("hidden");

    document
      .getElementById("adminScreen")
      .classList.add("hidden");

    document
      .getElementById("logoutBtn")
      .classList.add("hidden");

  }


  function showAdmin() {

    document
      .getElementById("loginScreen")
      .classList.add("hidden");

    document
      .getElementById("adminScreen")
      .classList.remove("hidden");

    document
      .getElementById("logoutBtn")
      .classList.remove("hidden");

    loadLibrary();

  }


  async function login() {

    const username =
      document.getElementById("username").value;

    const password =
      document.getElementById("password").value;


    const message =
      document.getElementById("loginMessage");


    try {

      await api("/api/login", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          username,
          password
        })

      });


      showAdmin();


    } catch (error) {

      message.textContent =
        error.message;

      message.style.display =
        "block";

    }

  }


  async function logout() {

    await api("/api/logout", {
      method: "POST"
    });

    showLogin();

  }


  async function loadLibrary() {

    library =
      await api("/api/library");

    renderAircraft();

  }


  function renderAircraft() {

    const container =
      document.getElementById("aircraftList");

    container.innerHTML = "";


    if (!library.aircraft ||
        library.aircraft.length === 0) {

      container.innerHTML = `
        <p>Er zijn nog geen aircraft toegevoegd.</p>
      `;

      return;

    }


    library.aircraft.forEach(aircraft => {

      const div =
        document.createElement("div");

      div.className =
        "aircraft";


      const manuals =
        aircraft.manuals || [];


      div.innerHTML = `

        <div class="aircraft-header">

          <div class="aircraft-name">
            ${escapeHtml(aircraft.name)}
          </div>

          <div>

            <button
              onclick="renameAircraft('${aircraft.id}')">
              Naam wijzigen
            </button>

            <button
              class="danger"
              onclick="deleteAircraft('${aircraft.id}')">
              Verwijderen
            </button>

          </div>

        </div>


        <h3>Manual toevoegen</h3>

        <label>Manual type</label>

        <select id="type-${aircraft.id}">

          <option value="AMM">
            AMM
          </option>

          <option value="IPC">
            IPC
          </option>

        </select>


        <label>PDF bestand</label>

        <input
          id="file-${aircraft.id}"
          type="file"
          accept="application/pdf">


        <button
          onclick="uploadManual('${aircraft.id}')">
          Manual uploaden
        </button>


        <h3>Manuals</h3>

        <div>

          ${
            manuals.length
            ? manuals.map(manual => `

              <div class="manual">

                <div>

                  <span class="manual-type">
                    ${escapeHtml(
                      manual.type || "AMM"
                    )}
                  </span>

                  ${escapeHtml(
                    manual.name ||
                    manual.filename ||
                    "Manual"
                  )}

                </div>


                <button
                  class="danger"
                  onclick="deleteManual('${manual.id}')">
                  Verwijderen
                </button>

              </div>

            `).join("")

            : "<p>Geen manuals.</p>"
          }

        </div>

      `;


      container.appendChild(div);

    });

  }


  async function addAircraft() {

    const name =
      document
        .getElementById("aircraftName")
        .value
        .trim();


    if (!name) {

      showMessage(
        "Vul een aircraft naam in.",
        true
      );

      return;

    }


    try {

      await api("/api/admin/aircraft", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          name
        })

      });


      document
        .getElementById("aircraftName")
        .value = "";


      showMessage(
        "Aircraft toegevoegd."
      );


      loadLibrary();


    } catch (error) {

      showMessage(
        error.message,
        true
      );

    }

  }


  async function renameAircraft(id) {

    const aircraft =
      library.aircraft.find(
        a => String(a.id) === String(id)
      );


    const name =
      prompt(
        "Nieuwe naam:",
        aircraft?.name || ""
      );


    if (!name) return;


    try {

      await api(
        `/api/admin/aircraft/${id}`,
        {
          method: "PUT",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            name
          })
        }
      );


      showMessage(
        "Aircraft aangepast."
      );


      loadLibrary();


    } catch (error) {

      showMessage(
        error.message,
        true
      );

    }

  }


  async function deleteAircraft(id) {

    if (!confirm(
      "Aircraft en alle manuals verwijderen?"
    )) return;


    try {

      await api(
        `/api/admin/aircraft/${id}`,
        {
          method: "DELETE"
        }
      );


      showMessage(
        "Aircraft verwijderd."
      );


      loadLibrary();


    } catch (error) {

      showMessage(
        error.message,
        true
      );

    }

  }


  async function uploadManual(aircraftId) {

    const fileInput =
      document.getElementById(
        `file-${aircraftId}`
      );


    const typeSelect =
      document.getElementById(
        `type-${aircraftId}`
      );


    const file =
      fileInput.files[0];


    const type =
      typeSelect.value;


    if (!file) {

      showMessage(
        "Kies eerst een PDF.",
        true
      );

      return;

    }


    if (
      file.type !== "application/pdf" &&
      !file.name.toLowerCase().endsWith(".pdf")
    ) {

      showMessage(
        "Alleen PDF-bestanden zijn toegestaan.",
        true
      );

      return;

    }


    const formData =
      new FormData();


    formData.append(
      "manuals",
      file
    );


    formData.append(
      "type",
      type
    );


    try {

      showMessage(
        "Manual wordt geüpload..."
      );


      const response =
        await fetch(
          `/api/admin/manuals?aircraftId=${encodeURIComponent(aircraftId)}&type=${encodeURIComponent(type)}`,
          {
            method: "POST",
            credentials: "include",
            body: formData
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "Upload mislukt."
        );

      }


      showMessage(
        `${type} manual toegevoegd.`
      );


      fileInput.value = "";


      loadLibrary();


    } catch (error) {

      showMessage(
        error.message,
        true
      );

    }

  }


  async function deleteManual(id) {

    if (!confirm(
      "Deze manual verwijderen?"
    )) return;


    try {

      await api(
        `/api/admin/manuals/${id}`,
        {
          method: "DELETE"
        }
      );


      showMessage(
        "Manual verwijderd."
      );


      loadLibrary();


    } catch (error) {

      showMessage(
        error.message,
        true
      );

    }

  }


  function showMessage(
    message,
    error = false
  ) {

    const element =
      document.getElementById("message");


    element.textContent =
      message;

    element.className =
      "message " +
      (error ? "error" : "success");

    element.style.display =
      "block";


    setTimeout(() => {

      element.style.display =
        "none";

    }, 5000);

  }


  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  checkLogin();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VlocX - ATA Manual Viewer</title>
    <!-- PDF.js bibliotheek -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.74/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.74/pdf.worker.min.js';
    </script>
    <style>
        :root {
            --airbus-header: #071930;
            --airbus-orange: #f59e0b;
            --bg-dark: #0f172a;
            --sidebar-bg: #1e293b;
            --text-light: #f8fafc;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Zijbalk */
        aside {
            width: 320px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        h1 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: var(--airbus-orange);
            border-bottom: 2px solid #334155;
            padding-bottom: 10px;
        }

        .upload-section {
            margin-bottom: 20px;
        }

        .upload-section label {
            display: block;
            background-color: #3b82f6;
            color: white;
            padding: 10px;
            text-align: center;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .upload-section label:hover {
            background-color: #2563eb;
        }

        .upload-section input {
            display: none;
        }

        .file-list {
            flex-grow: 1;
            overflow-y: auto;
            list-style: none;
        }

        .file-item {
            padding: 10px;
            margin-bottom: 8px;
            background-color: #334155;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
            word-break: break-all;
        }

        .file-item:hover, .file-item.active {
            background-color: #475569;
            border-left: 4px solid var(--airbus-orange);
        }

        /* Hoofdweergave */
        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background-color: #0b0f19;
            position: relative;
        }

        #pdf-viewer-container {
            flex-grow: 1;
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }

        canvas {
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 100%;
        }

        .controls {
            background-color: var(--sidebar-bg);
            padding: 10px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            border-top: 1px solid #334155;
        }

        button.ctrl-btn {
            background-color: #334155;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
        }

        button.ctrl-btn:hover {
            background-color: #475569;
        }
    </style>
</head>
<body>

    <aside>
        <h1>Airbus ATA Viewer</h1>
        <div class="upload-section">
            <label for="file-input">📂 Kies Manual(s)</label>
            <input type="file" id="file-input" accept="application/pdf" multiple>
        </div>
        <ul id="file-list" class="file-list">
            <li style="color: #94a3b8; font-size: 0.9rem; text-align: center; margin-top: 20px;">Geen manuals geladen. Selecteer bestanden om te starten.</li>
        </ul>
    </aside>

    <main>
        <div id="pdf-viewer-container">
            <p id="placeholder-text" style="margin-top: 50px; color: #64748b;">Selecteer een manual uit de lijst aan de linkerkant.</p>
            <canvas id="pdf-canvas"></canvas>
        </div>
        <div class="controls" id="pdf-controls" style="display: none;">
            <button class="ctrl-btn" id="prev-page">Vorige</button>
            <span>Pagina <span id="page-num"></span> van <span id="page-count"></span></span>
            <button class="ctrl-btn" id="next-page">Volgende</button>
        </div>
    </main>

    <script>
        let pdfDoc = null,
            pageNum = 1,
            pageRendering = false,
            pageNumPending = null,
            scale = 1.5,
            canvas = document.getElementById('pdf-canvas'),
            ctx = canvas.getContext('2d');

        const fileInput = document.getElementById('file-input');
        const fileListUI = document.getElementById('file-list');
        const placeholderText = document.getElementById('placeholder-text');
        const pdfControls = document.getElementById('pdf-controls');

        let loadedFiles = {};

        fileInput.addEventListener('change', function(e) {
            const files = e.target.files;
            if (files.length === 0) return;

            if(fileListUI.innerHTML.includes('Geen manuals geladen')) {
                fileListUI.innerHTML = '';
            }

            for (let i = 0; i < files.length; i++) {
                let file = files[i];
                loadedFiles[file.name] = file;

                let li = document.createElement('li');
                li.className = 'file-item';
                li.textContent = file.name;
                li.onclick = () => {
                    document.querySelectorAll('.file-item').forEach(item => item.classList.remove('active'));
                    li.classList.add('active');
                    loadPDF(file);
                };
                fileListUI.appendChild(li);

                // Open automatisch de eerste als er nog niets open staat
                if (i === 0 && !pdfDoc) {
                    li.classList.add('active');
                    loadPDF(file);
                }
            }
        });

        function loadPDF(file) {
            placeholderText.style.display = 'none';
            let fileReader = new FileReader();
            fileReader.onload = function() {
                let typedarray = new Uint8Array(this.result);
                pdfjsLib.getDocument(typedarray).promise.then(function(pdfDoc_) {
                    pdfDoc = pdfDoc_;
                    document.getElementById('page-count').textContent = pdfDoc.numPages;
                    pageNum = 1;
                    renderPage(pageNum);
                    pdfControls.style.display = 'flex';
                });
            };
            fileReader.readAsArrayBuffer(file);
        }

        function renderPage(num) {
            pageRendering = true;
            pdfDoc.getPage(num).then(function(page) {
                let viewport = page.getViewport({scale: scale});
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                let renderContext = {
                    canvasContext: ctx,
                    viewport: viewport
                };
                let renderTask = page.render(renderContext);

                renderTask.promise.then(function() {
                    pageRendering = false;
                    if (pageNumPending !== null) {
                        renderPage(pageNumPending);
                        pageNumPending = null;
                    }
                });
            });
            document.getElementById('page-num').textContent = num;
        }

        document.getElementById('prev-page').addEventListener('click', () => {
            if (pageNum <= 1) return;
            pageNum--;
            renderPage(pageNum);
        });

        document.getElementById('next-page').addEventListener('click', () => {
            if (pageNum >= pdfDoc.numPages) return;
            pageNum++;
            renderPage(pageNum);
        });
    </script>
</body>
</html>

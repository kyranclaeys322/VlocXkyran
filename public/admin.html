<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VlocX Kyran - Admin</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#e2e8f0;
    color:#1e293b;
}

header{
    height:60px;
    background:#071930;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    border-bottom:2px solid #00a9e0;
}

.logo{
    font-size:21px;
    font-weight:bold;
}

.logo span{
    color:#00a9e0;
    font-weight:normal;
}

button{
    border:none;
    border-radius:4px;
    padding:9px 14px;
    cursor:pointer;
    font-weight:bold;
}

.blue-button{
    background:#0284c7;
    color:white;
}

.blue-button:hover{
    background:#0369a1;
}

.red-button{
    background:#dc2626;
    color:white;
}

.red-button:hover{
    background:#b91c1c;
}

.gray-button{
    background:#64748b;
    color:white;
}

.green-button{
    background:#16a34a;
    color:white;
}

.login-container{
    width:100%;
    max-width:420px;
    margin:80px auto;
    background:white;
    padding:30px;
    border-radius:8px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.login-container h1{
    margin-top:0;
    color:#071930;
}

.login-container p{
    color:#64748b;
    font-size:13px;
}

label{
    display:block;
    font-size:12px;
    font-weight:bold;
    margin-top:18px;
    margin-bottom:6px;
}

input,select{
    width:100%;
    padding:10px;
    border:1px solid #cbd5e1;
    border-radius:4px;
    font-size:14px;
}

.login-button{
    width:100%;
    margin-top:22px;
    background:#071930;
    color:white;
}

.login-button:hover{
    background:#0284c7;
}

.error{
    color:#dc2626;
    background:#fee2e2;
    border:1px solid #fecaca;
    padding:10px;
    border-radius:4px;
    font-size:12px;
    margin-top:15px;
    display:none;
}

#dashboard{
    display:none;
}

.dashboard{
    max-width:1200px;
    margin:25px auto;
    padding:0 20px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.topbar h1{
    margin:0;
    color:#071930;
}

.topbar-buttons{
    display:flex;
    gap:8px;
}

.add-aircraft{
    background:white;
    padding:20px;
    border-radius:7px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    margin-bottom:20px;
}

.add-aircraft h2{
    margin-top:0;
    font-size:17px;
    color:#071930;
}

.add-row{
    display:flex;
    gap:8px;
}

.add-row input{
    flex:1;
}

.aircraft-card{
    background:white;
    border-radius:7px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.aircraft-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:15px;
}

.aircraft-name{
    display:flex;
    gap:8px;
    flex:1;
}

.aircraft-name input{
    max-width:400px;
    font-weight:bold;
}

.aircraft-actions{
    display:flex;
    gap:6px;
}

.manuals-title{
    font-size:13px;
    font-weight:bold;
    margin-bottom:8px;
    color:#475569;
}

.manual-list{
    margin-bottom:15px;
}

.manual{
    display:flex;
    align-items:center;
    justify-content:space-between;
    border:1px solid #e2e8f0;
    border-radius:4px;
    padding:10px;
    margin-bottom:6px;
    background:#f8fafc;
}

.manual-name{
    font-size:13px;
    font-weight:bold;
}

.manual-id{
    color:#64748b;
    font-size:10px;
    margin-top:3px;
}

.upload-area{
    border:2px dashed #cbd5e1;
    padding:18px;
    border-radius:5px;
    background:#f8fafc;
}

.upload-area:hover{
    border-color:#0284c7;
}

.upload-area input{
    background:white;
}

.upload-info{
    font-size:11px;
    color:#64748b;
    margin:8px 0;
}

.status{
    margin-top:10px;
    font-size:12px;
    font-weight:bold;
}

.empty{
    color:#64748b;
    font-size:12px;
    padding:10px 0;
}

@media(max-width:700px){
    .aircraft-header{
        flex-direction:column;
        align-items:stretch;
    }

    .aircraft-actions{
        justify-content:flex-start;
    }

    .add-row{
        flex-direction:column;
    }

    .manual{
        flex-direction:column;
        align-items:flex-start;
        gap:8px;
    }

    .topbar{
        flex-direction:column;
        align-items:flex-start;
        gap:10px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">
        VlocX <span>Kyran</span> — ADMIN
    </div>

    <div>
        <button
            class="gray-button"
            onclick="window.location.href='/'">
            ← Website
        </button>
    </div>
</header>

<div id="loginPage">

    <div class="login-container">

        <h1>🔐 Admin Login</h1>

        <p>
            Log in om de VlocX manuals te beheren.
        </p>

        <label>Gebruikersnaam</label>

        <input
            type="text"
            id="username"
            autocomplete="username"
            placeholder="Gebruikersnaam">

        <label>Wachtwoord</label>

        <input
            type="password"
            id="password"
            autocomplete="current-password"
            placeholder="Wachtwoord"
            onkeydown="if(event.key === 'Enter'){login();}">

        <button
            class="login-button"
            onclick="login()">
            INLOGGEN
        </button>

        <div id="loginError" class="error"></div>

    </div>

</div>

<div id="dashboard">

    <div class="dashboard">

        <div class="topbar">

            <div>
                <h1>Manual Beheer</h1>

                <div style="
                    color:#64748b;
                    font-size:12px;
                    margin-top:5px;
                ">
                    VlocX Kyran
                </div>
            </div>

            <div class="topbar-buttons">

                <button
                    class="blue-button"
                    onclick="loadLibrary()">
                    ↻ Vernieuwen
                </button>

                <button
                    class="red-button"
                    onclick="logout()">
                    Uitloggen
                </button>

            </div>

        </div>

        <div class="add-aircraft">

            <h2>✈️ Aircraft toevoegen</h2>

            <div class="add-row">

                <input
                    id="newAircraftName"
                    type="text"
                    placeholder="Bijvoorbeeld: Airbus A320">

                <button
                    class="green-button"
                    onclick="addAircraft()">
                    + Aircraft toevoegen
                </button>

            </div>

            <div
                id="aircraftMessage"
                class="status">
            </div>

        </div>

        <div id="aircraftList">

            <div class="empty">
                Laden...
            </div>

        </div>

    </div>

</div>

<script>

async function checkLogin(){

    try{

        const response =
            await fetch("/api/me");

        const data =
            await response.json();

        if(data.loggedIn){

            showDashboard();

        }else{

            showLogin();

        }

    }catch(error){

        showLogin();

    }

}

async function login(){

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;

    const errorBox =
        document.getElementById("loginError");

    errorBox.style.display="none";

    try{

        const response =
            await fetch("/api/login",{

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({
                    username,
                    password
                })

            });

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.error ||
                "Inloggen mislukt."
            );

        }

        showDashboard();

    }catch(error){

        errorBox.innerText =
            error.message;

        errorBox.style.display =
            "block";

    }

}

async function logout(){

    await fetch(
        "/api/logout",
        {
            method:"POST"
        }
    );

    showLogin();

}

function showLogin(){

    document.getElementById(
        "loginPage"
    ).style.display="block";

    document.getElementById(
        "dashboard"
    ).style.display="none";

}

async function showDashboard(){

    document.getElementById(
        "loginPage"
    ).style.display="none";

    document.getElementById(
        "dashboard"
    ).style.display="block";

    await loadLibrary();

}

async function loadLibrary(){

    const container =
        document.getElementById(
            "aircraftList"
        );

    container.innerHTML =
        `<div class="empty">
            Manuals laden...
         </div>`;

    try{

        const response =
            await fetch("/api/library");

        if(!response.ok){

            throw new Error(
                "Library kon niet worden geladen."
            );

        }

        const data =
            await response.json();

        renderAircraft(
            data.aircraft || []
        );

    }catch(error){

        container.innerHTML =
            `<div class="error"
                style="display:block;">
                ${escapeHtml(error.message)}
             </div>`;

    }

}

function renderAircraft(aircraftList){

    const container =
        document.getElementById(
            "aircraftList"
        );

    container.innerHTML="";

    if(!aircraftList.length){

        container.innerHTML =
            `<div class="empty">
                Er zijn nog geen aircrafts.
             </div>`;

        return;

    }

    aircraftList.forEach(aircraft => {

        const card =
            document.createElement("div");

        card.className =
            "aircraft-card";

        const manuals =
            aircraft.manuals || [];

        card.innerHTML = `

            <div class="aircraft-header">

                <div class="aircraft-name">

                    <input
                        id="aircraft-name-${escapeHtml(
                            aircraft.id
                        )}"
                        value="${escapeHtml(
                            aircraft.name
                        )}">

                </div>

                <div class="aircraft-actions">

                    <button
                        class="blue-button"
                        onclick="renameAircraft(
                            '${escapeJs(aircraft.id)}'
                        )">
                        Opslaan
                    </button>

                    <button
                        class="red-button"
                        onclick="deleteAircraft(
                            '${escapeJs(aircraft.id)}',
                            '${escapeJs(aircraft.name)}'
                        )">
                        Verwijderen
                    </button>

                </div>

            </div>

            <div class="manuals-title">
                Manuals (${manuals.length} / 4)
            </div>

            <div class="manual-list">

                ${
                    manuals.length
                    ?
                    manuals.map(manual => `

                        <div class="manual">

                            <div>

                                <div class="manual-name">
                                    📕
                                    ${escapeHtml(
                                        manual.name
                                    )}
                                </div>

                                <div class="manual-id">
                                    Manual ID:
                                    ${escapeHtml(
                                        manual.id
                                    )}
                                </div>

                            </div>

                            <button
                                class="red-button"
                                onclick="deleteManual(
                                    '${escapeJs(manual.id)}',
                                    '${escapeJs(manual.name)}'
                                )">
                                Verwijderen
                            </button>

                        </div>

                    `).join("")

                    :

                    `<div class="empty">
                        Nog geen manuals toegevoegd.
                     </div>`
                }

            </div>

            ${
                manuals.length < 4
                ?

                `

                <div class="upload-area">

                    <strong>
                        📤 Manual toevoegen
                    </strong>

                    <div class="upload-info">
                        Kies maximaal
                        ${4 - manuals.length}
                        PDF-bestand(en).
                    </div>

                    <input
                        type="file"
                        id="files-${escapeHtml(
                            aircraft.id
                        )}"
                        accept=".pdf,application/pdf"
                        multiple>

                    <br><br>

                    <button
                        class="green-button"
                        onclick="uploadManuals(
                            '${escapeJs(aircraft.id)}'
                        )">
                        ⬆ Manuals uploaden
                    </button>

                    <div
                        id="upload-status-${escapeHtml(
                            aircraft.id
                        )}"
                        class="status">
                    </div>

                </div>

                `

                :

                `

                <div style="
                    padding:12px;
                    background:#fef3c7;
                    border:1px solid #fde68a;
                    border-radius:4px;
                    font-size:12px;
                ">
                    ⚠️ Dit aircraft heeft al
                    4 manuals.
                </div>

                `
            }

        `;

        container.appendChild(card);

    });

}

async function addAircraft(){

    const input =
        document.getElementById(
            "newAircraftName"
        );

    const name =
        input.value.trim();

    const message =
        document.getElementById(
            "aircraftMessage"
        );

    message.innerText="";

    if(!name){

        message.style.color="#dc2626";

        message.innerText =
            "Vul eerst een naam in.";

        return;

    }

    try{

        const response =
            await fetch(
                "/api/admin/aircraft",
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            name
                        })

                }
            );

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.error ||
                "Aircraft toevoegen mislukt."
            );

        }

        input.value="";

        message.style.color="#16a34a";

        message.innerText =
            "Aircraft toegevoegd.";

        await loadLibrary();

    }catch(error){

        message.style.color="#dc2626";

        message.innerText =
            error.message;

    }

}

async function renameAircraft(id){

    const input =
        document.getElementById(
            "aircraft-name-" + id
        );

    const name =
        input.value.trim();

    if(!name){

        alert(
            "De naam mag niet leeg zijn."
        );

        return;

    }

    try{

        const response =
            await fetch(
                "/api/admin/aircraft/" +
                encodeURIComponent(id),
                {

                    method:"PUT",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            name
                        })

                }
            );

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.error ||
                "Opslaan mislukt."
            );

        }

        alert(
            "Aircraft opgeslagen."
        );

        await loadLibrary();

    }catch(error){

        alert(
            error.message
        );

    }

}

async function deleteAircraft(id,name){

    const confirmed =
        confirm(
            `Weet je zeker dat je "${name}" wilt verwijderen?\n\n`
            +
            "Alle manuals van dit aircraft worden ook verwijderd."
        );

    if(!confirmed){
        return;
    }

    try{

        const response =
            await fetch(
                "/api/admin/aircraft/" +
                encodeURIComponent(id),
                {
                    method:"DELETE"
                }
            );

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.error ||
                "Verwijderen mislukt."
            );

        }

        await loadLibrary();

    }catch(error){

        alert(
            error.message
        );

    }

}

async function uploadManuals(aircraftId){

    const input =
        document.getElementById(
            "files-" + aircraftId
        );

    const status =
        document.getElementById(
            "upload-status-" +
            aircraftId
        );

    if(
        !input.files ||
        !input.files.length
    ){

        status.style.color =
            "#dc2626";

        status.innerText =
            "Kies eerst minstens één PDF.";

        return;

    }

    if(input.files.length > 4){

        status.style.color =
            "#dc2626";

        status.innerText =
            "Je kunt maximaal 4 bestanden tegelijk kiezen.";

        return;

    }

    for(const file of input.files){

        if(
            !file.name
                .toLowerCase()
                .endsWith(".pdf")
        ){

            status.style.color =
                "#dc2626";

            status.innerText =
                "Alle bestanden moeten PDF-bestanden zijn.";

            return;

        }

    }

    const formData =
        new FormData();

    formData.append(
        "aircraftId",
        aircraftId
    );

    for(const file of input.files){

        formData.append(
            "manuals",
            file
        );

    }

    status.style.color =
        "#0284c7";

    status.innerText =
        "Uploaden... Even wachten.";

    try{

        const response =
            await fetch(
                "/api/admin/manuals",
                {

                    method:"POST",

                    body:formData

                }
            );

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.error ||
                "Upload mislukt."
            );

        }

        status.style.color =
            "#16a34a";

        status.innerText =
            "Manual(s) succesvol toegevoegd.";

        input.value="";

        await loadLibrary();

    }catch(error){

        status.style.color =
            "#dc2626";

        status.innerText =
            error.message;

    }

}

async function deleteManual(id,name){

    const confirmed =
        confirm(
            `Weet je zeker dat je deze manual wilt verwijderen?\n\n${name}`
        );

    if(!confirmed){
        return;
    }

    try{

        const response =
            await fetch(
                "/api/admin/manuals/" +
                encodeURIComponent(id),
                {

                    method:"DELETE"

                }
            );

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.error ||
                "Manual verwijderen mislukt."
            );

        }

        await loadLibrary();

    }catch(error){

        alert(
            error.message
        );

    }

}

function escapeHtml(value){

    return String(value || "")
        .replace(
            /[&<>'"]/g,
            character => ({

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                "'":"&#39;",
                '"':"&quot;"

            })[character]
        );

}

function escapeJs(value){

    return String(value || "")
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        );

}

checkLogin();

</script>

</body>
</html>

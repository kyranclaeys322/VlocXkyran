  async function checkLogin() {

    try {

      const response = await fetch("/api/me");

      if (!response.ok) {
        showLogin();
        return;
      }

      const data = await response.json();

      if (data.loggedIn) {
        showAdmin();
      } else {
        showLogin();
      }

    } catch (error) {
      showLogin();
    }
  }


  function showLogin() {

    document.getElementById("loginPage").classList.remove("hidden");
    document.getElementById("adminPage").classList.add("hidden");

  }


  function showAdmin() {

    document.getElementById("loginPage").classList.add("hidden");
    document.getElementById("adminPage").classList.remove("hidden");

    loadLibrary();

  }


  async function login() {

    const username =
      document.getElementById("username").value.trim();

    const password =
      document.getElementById("password").value;

    const error =
      document.getElementById("loginError");

    error.innerText = "";

    if (!username || !password) {

      error.innerText =
        "Vul gebruikersnaam en wachtwoord in.";

      return;
    }

    try {

      const response = await fetch("/api/login", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          username,
          password
        })

      });

      const data = await response.json();

      if (!response.ok) {

        error.innerText =
          data.error || "Inloggen mislukt.";

        return;
      }

      showAdmin();

    } catch (err) {

      error.innerText =
        "Kan geen verbinding maken met de server.";

    }

  }


  async function logout() {

    await fetch("/api/logout", {
      method: "POST"
    });

    showLogin();

  }


  function goWebsite() {

    window.location.href = "/";

  }

    const input =
      document.getElementById("newAircraftName");

    const status =
      document.getElementById("aircraftStatus");

    const name =
      input.value.trim();

    status.innerText = "";

    if (!name) {

      status.style.color = "#dc2626";
      status.innerText =
        "Vul eerst een aircraft naam in.";

      return;
    }

    try {

      const response = await fetch(
        "/api/admin/aircraft",

          method: "POST",

          headers: {

          },

          body: JSON.stringify({
            name
          })
        }
      );

      const data = await response.json();

      if (!response.ok) {

        status.style.color = "#dc2626";
        status.innerText =
          data.error || "Aircraft toevoegen mislukt.";

        return;
      }

      input.value = "";

      status.style.color = "#16a34a";
      status.innerText =
        "Aircraft toegevoegd.";

      loadLibrary();

    } catch (error) {

      status.style.color = "#dc2626";
      status.innerText =
        "Er ging iets fout.";

    }

  }
